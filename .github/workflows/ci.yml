# THE VOID — CI quality gate.
#
# Runs the hermetic Python suites, frontend checks, and secret scan on every
# push to main and every pull request. Live security-tool integrations remain
# an operator-run acceptance step on the intended Kali machine.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run unit test suite
        run: |
          python -m pytest tests commandcenter/tests/backend -q --timeout=600

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commandcenter/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: commandcenter/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
          TRIVY_FILE_PATTERNS: 'pip:release/requirements-runtime\.txt'
          TRIVY_LIST_ALL_PKGS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          format: json
          output: dependency-scan.json
      - name: Require both runtime and browser inventories
        run: python3 -m release.check_scan_inventory dependency-scan.json

  secret-scan:
    # Guard against H1-class credential leaks (e.g. service-account keys in tree).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check agent c2 cli commandcenter config core exploit llm modules orchestrator recon scenarios tests \
            --select E9,F63,F7,F82 --output-format=github
          ruff check core/private_storage.py core/recovery_guard.py commandcenter/session.py modules/evidence_reports.py release/check_scan_inventory.py \
            --select E9,F,S --output-format=github

  defensive-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install exact runtime and test-only dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r release/requirements-runtime.txt
          python -m pip install pytest pytest-asyncio
          python -m pip check
      - name: Run isolated defensive regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -p no:cacheprovider tests/test_hardening.py tests/test_local_session.py tests/test_runtime_paths.py tests/test_commandcenter_launcher.py tests/test_run_entrypoint.py tests/test_licensing.py tests/test_reporter.py tests/test_release_verification.py -q
      - name: Verify required protocol is importable
        run: python -c 'from uvicorn.protocols.websockets.wsproto_impl import WSProtocol; assert WSProtocol is not None'
