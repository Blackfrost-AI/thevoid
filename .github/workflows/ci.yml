# THE VOID — CI quality gate.
#
# Runs the hermetic Python suites, frontend checks, and secret scan on every
# push to main and every pull request. Live security-tool integrations remain
# an operator-run acceptance step on the intended Kali machine.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run unit test suite
        run: |
          python -m pytest tests commandcenter/tests/backend -q --timeout=600

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: commandcenter/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: commandcenter/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  secret-scan:
    # Guard against H1-class credential leaks (e.g. service-account keys in tree).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check agent c2 cli commandcenter config core exploit llm modules orchestrator recon scenarios tests \
            --select E9,F63,F7,F82 --output-format=github
